# Local production-like stack. For Coolify, point it at the Dockerfile and
# supply the same environment variables through the dashboard instead.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dropbox}
      # No default. A password that ships in the repository is a published
      # credential, and `dropbox/dropbox` on an exposed port is the whole
      # database — leads, accounts, password hashes and MFA secrets included.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dropbox_reseller}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dropbox}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Bound to loopback, never to every interface.
    #
    # `- '5432:5432'` publishes the database on 0.0.0.0, which on a server with
    # a public IP means the internet can reach it directly — the application
    # itself does not need this at all, it talks to `db:5432` over the compose
    # network. The explicit 127.0.0.1 keeps a psql or TablePlus session working
    # on the machine running the stack, and nowhere else.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dropbox}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-dropbox_reseller}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Filesystem storage by default: no bucket, no account, no key.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MEDIA_PUBLIC_PATH: ${MEDIA_PUBLIC_PATH:-/media}
      # Only read when STORAGE_DRIVER is s3 or r2. Empty is correct otherwise.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RUN_MIGRATIONS: 'true'
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT:-false}
      BACKUP_STORAGE_DRIVER: ${BACKUP_STORAGE_DRIVER:-local}
      BACKUP_LOCAL_PATH: ${BACKUP_LOCAL_PATH:-/app/backups}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-3}
      CRON_SECRET: ${CRON_SECRET:-}
      DESKZO_API_URL: ${DESKZO_API_URL:-}
      DESKZO_KEY_ID: ${DESKZO_KEY_ID:-}
      DESKZO_SECRET: ${DESKZO_SECRET:-}
      MFA_ISSUER: ${MFA_ISSUER:-Dropbox Reseller}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      # The media library. This is production data, not a cache: without it,
      # every uploaded image is destroyed by the next `docker compose up
      # --build`. Needed for STORAGE_DRIVER=local; droppable only with S3/R2.
      - media-data:/data/uploads
      # Where uploads were written before /data/uploads. Mounted read-write but
      # never written to, so a stack upgraded from an older version keeps
      # serving the files it already had — nothing has to be migrated.
      - uploads:/app/public/uploads
      # Backup archives. Keep this even with S3 backup storage: restores and
      # imports stage archives here before they are read.
      - backups:/app/backups

volumes:
  postgres-data:
  media-data:
  uploads:
  backups:
